title = dnd3
description = Modular voxel virtual tabletop core game for dnd3.

# --- Fine Pixel Art render profile (default) ---
# These values are loaded as game-level defaults.  Players can override them
# in dnd3.conf.  See dnd3.conf.example for full documentation.
#
# Nearest-neighbor is already the engine default; all three filter flags below
# must remain false to preserve crisp pixel boundaries.
mip_map = false
bilinear_filter = false
trilinear_filter = false
anisotropic_filter = false
#
# Visual scale – each node occupies 75 % of its original clip-space area,
# giving a diorama / fine-detail appearance without changing gameplay.
voxel_visual_scale = 0.75
#
# Cel-shading quantises lighting into 6 discrete bands.
pixel_art_cel_shading = true
pixel_art_cel_shading_steps = 6
#
# Sobel outline pass (requires enable_post_processing = true).
pixel_art_outlines = true
pixel_art_outline_strength = 1.0
#
# Post-processing is required for outlines.  Enable it here so it is on by
# default even for players who have not configured it in dnd3.conf.
enable_post_processing = true
